<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Host File Browser</title>
  <style>
    :root {
      --bg-dark: #12141a;
      --card-bg: #1a1d26;
      --card-border: #292e3d;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 24px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 600;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: #252a38;
      border-color: #3e465b;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    main {
      flex: 1;
      padding: 24px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Upload Zone */
    .upload-zone {
      border: 2px dashed var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      background: rgba(26, 29, 38, 0.5);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.05);
    }

    .upload-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .upload-text {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .upload-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Navigation & Breadcrumb */
    .nav-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 10px 16px;
    }

    .breadcrumb {
      flex: 1;
      font-family: monospace;
      font-size: 13px;
      color: var(--text);
      overflow-x: auto;
      white-space: nowrap;
    }

    /* Entries List */
    .entries-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .entry-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(41, 46, 61, 0.6);
      transition: background 0.15s ease;
      cursor: pointer;
    }

    .entry-row:last-child {
      border-bottom: none;
    }

    .entry-row:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .entry-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .entry-icon {
      font-size: 20px;
    }

    .entry-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .entry-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 12px;
    }

    .entry-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 12px;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      color: #fff;
      padding: 12px 20px;
      border-radius: var(--radius);
      border: 1px solid #334155;
      font-size: 13px;
      display: none;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      z-index: 1000;
    }

    #toast.success { border-color: var(--success); }
    #toast.error { border-color: var(--danger); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-icon">📁</span>
      <div>
        <div class="brand-title">OBS Host File Browser</div>
        <div class="brand-subtitle">Standalone Media & Disk File Management</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn" id="btn-refresh" title="Refresh files">🔄 Refresh</button>
      <a href="/" class="btn btn-primary" title="Return to OBS Dashboard">← OBS Blade Dashboard</a>
    </div>
  </header>

  <main>
    <!-- Drag and Drop Upload -->
    <div class="upload-zone" id="drop-zone">
      <div class="upload-icon">📤</div>
      <div class="upload-text">Drag & drop media files here, or click to upload to OBS host</div>
      <div class="upload-hint">Supported: Videos (.mp4, .mov, .mkv), Images (.png, .jpg), Audio (.mp3, .wav)</div>
      <input type="file" id="file-input" style="display: none;" multiple>
    </div>

    <!-- Navigation Breadcrumb -->
    <div class="nav-bar">
      <button class="btn btn-sm" id="btn-nav-up" style="display: none;">⬆ Up</button>
      <div class="breadcrumb" id="breadcrumb-text">Loading...</div>
    </div>

    <!-- Entries -->
    <div class="entries-container" id="entries-list">
      <div style="padding: 32px; text-align: center; color: var(--text-muted); font-size: 13px;">
        Loading directories...
      </div>
    </div>
  </main>

  <div id="toast"></div>

  <script>
    let currentDir = '';
    let parentDir = null;

    const el = {
      breadcrumbText: document.getElementById('breadcrumb-text'),
      entriesList: document.getElementById('entries-list'),
      btnNavUp: document.getElementById('btn-nav-up'),
      btnRefresh: document.getElementById('btn-refresh'),
      dropZone: document.getElementById('drop-zone'),
      fileInput: document.getElementById('file-input'),
      toast: document.getElementById('toast'),
    };

    function showToast(msg, type = 'info') {
      el.toast.textContent = msg;
      el.toast.className = type;
      el.toast.style.display = 'block';
      setTimeout(() => {
        el.toast.style.display = 'none';
      }, 3500);
    }

    async function loadDirectory(dir) {
      el.entriesList.innerHTML = `
        <div style="padding: 32px; text-align: center; color: var(--text-muted); font-size: 13px;">
          Reading files...
        </div>
      `;

      try {
        const res = await fetch(`/api/fs/browse?dir=${encodeURIComponent(dir || '')}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        currentDir = data.currentDir;
        parentDir = data.parentDir;

        el.breadcrumbText.textContent = data.currentDir;
        el.btnNavUp.style.display = data.parentDir ? 'inline-flex' : 'none';

        renderEntries(data.entries || []);
      } catch (err) {
        el.entriesList.innerHTML = `
          <div style="padding: 32px; text-align: center; color: var(--danger); font-size: 13.5px;">
            Failed to connect to file service: ${err.message}
          </div>
        `;
      }
    }

    function renderEntries(entries) {
      el.entriesList.innerHTML = '';
      if (!entries.length) {
        el.entriesList.innerHTML = `
          <div style="padding: 32px; text-align: center; color: var(--text-muted); font-size: 13px;">
            This folder is empty.
          </div>
        `;
        return;
      }

      entries.forEach((item) => {
        const row = document.createElement('div');
        row.className = 'entry-row';

        const icon = item.isDirectory ? '📁' : getFileIcon(item.ext);
        const sizeStr = item.isDirectory ? '' : formatBytes(item.size);

        row.innerHTML = `
          <div class="entry-left">
            <span class="entry-icon">${icon}</span>
            <span class="entry-name">${escapeHtml(item.name)}</span>
            ${sizeStr ? `<span class="entry-meta">${sizeStr}</span>` : ''}
          </div>
          <div class="entry-actions">
            ${!item.isDirectory ? `
              <button class="btn btn-sm btn-copy-path" data-path="${escapeHtml(item.path)}" title="Copy absolute path for OBS">
                📋 Copy Path
              </button>
            ` : ''}
            <button class="btn btn-sm btn-open">
              ${item.isDirectory ? 'Open' : 'Select'}
            </button>
          </div>
        `;

        row.querySelector('.btn-open').addEventListener('click', (e) => {
          e.stopPropagation();
          if (item.isDirectory) {
            loadDirectory(item.path);
          } else {
            copyToClipboard(item.path);
          }
        });

        const copyBtn = row.querySelector('.btn-copy-path');
        if (copyBtn) {
          copyBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            copyToClipboard(item.path);
          });
        }

        row.addEventListener('click', () => {
          if (item.isDirectory) {
            loadDirectory(item.path);
          } else {
            copyToClipboard(item.path);
          }
        });

        el.entriesList.appendChild(row);
      });
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`✓ Copied path to clipboard: ${text}`, 'success');
      }).catch(() => {
        showToast(`Path: ${text}`);
      });
    }

    function getFileIcon(ext) {
      switch (ext) {
        case '.png': case '.jpg': case '.jpeg': case '.gif': case '.webp': return '🖼️';
        case '.mp4': case '.mov': case '.mkv': case '.webm': case '.avi': return '🎬';
        case '.mp3': case '.wav': case '.aac': case '.flac': case '.ogg': return '🎵';
        default: return '📄';
      }
    }

    function formatBytes(bytes) {
      if (!bytes) return '';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Upload handling
    async function uploadFiles(files) {
      if (!files || !files.length) return;
      showToast(`Uploading ${files.length} file(s) to host...`, 'info');

      for (const file of files) {
        const formData = new FormData();
        formData.append('media', file);
        try {
          const res = await fetch('/api/upload', {
            method: 'POST',
            body: formData,
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          showToast(`✓ Uploaded "${file.name}"!`, 'success');
        } catch (err) {
          showToast(`Failed to upload "${file.name}": ${err.message}`, 'error');
        }
      }

      loadDirectory(currentDir);
    }

    el.dropZone.addEventListener('click', () => el.fileInput.click());
    el.fileInput.addEventListener('change', (e) => uploadFiles(e.target.files));

    el.dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      el.dropZone.classList.add('dragover');
    });

    el.dropZone.addEventListener('dragleave', () => {
      el.dropZone.classList.remove('dragover');
    });

    el.dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      el.dropZone.classList.remove('dragover');
      uploadFiles(e.dataTransfer.files);
    });

    el.btnNavUp.addEventListener('click', () => {
      if (parentDir) loadDirectory(parentDir);
    });

    el.btnRefresh.addEventListener('click', () => {
      loadDirectory(currentDir);
    });

    // Initial load
    loadDirectory('__UPLOADS__');
  </script>
</body>
</html>
