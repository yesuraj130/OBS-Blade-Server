      <div class="modal-actions">
        <button type="button" id="props-copy" class="btn ghost">Copy Path</button>
        <button type="button" id="props-ok" class="btn primary">Done</button>
      </div>
    </div>
  </div>

  <!-- Startup Login Overlay -->
  <div id="login-overlay" class="login-overlay hidden">
    <form id="login-form" class="login-card">
      <div class="login-ico">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <div>
        <div class="login-title">Sign In</div>
        <div class="login-sub">Enter file server password to continue</div>
      </div>
      <div class="pass-box">
        <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password" />
        <button type="button" id="login-eye" class="icon-btn muted" style="width:36px;height:36px;" aria-label="Show password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div id="login-err" class="login-err hidden"></div>
      <button type="submit" id="login-submit" class="btn primary" style="width:100%;padding:12px;">Unlock</button>
    </form>
  </div>

  <!-- Snackbar Toast -->
  <div id="toast" class="toast hidden"></div>
</div>

<script>
(function () {
  var PW_KEY = 'obs_file_browser_pw';
  var VIEW_KEY = 'obs_fb_view_mode';
  var SORT_KEY = 'obs_fb_sort_mode';
  var BM_KEY = 'obs_fb_bookmarks';

  var IMG_EXTS = { '.png':1, '.jpg':1, '.jpeg':1, '.gif':1, '.webp':1, '.svg':1, '.bmp':1, '.ico':1 };
  var VID_EXTS = { '.mp4':1, '.mov':1, '.mkv':1, '.webm':1, '.m4v':1, '.avi':1 };
  var AUD_EXTS = { '.mp3':1, '.wav':1, '.aac':1, '.flac':1, '.ogg':1, '.m4a':1 };
  var TXT_EXTS = { '.txt':1, '.log':1, '.json':1, '.srt':1, '.vtt':1, '.md':1, '.js':1, '.ts':1, '.css':1, '.html':1, '.xml':1, '.yml':1, '.yaml':1, '.ini':1, '.conf':1, '.env':1, '.sh':1, '.bat':1, '.csv':1 };

  var state = {
    password: (function () { try { return localStorage.getItem(PW_KEY) || ''; } catch (_) { return ''; } })(),
    authRequired: false,
    platform: 'linux',
    currentDir: '__DRIVES__',
    parentDir: null,
    entries: [],
    selected: {},
    clipboard: null, // { mode: 'copy'|'cut', items: [...] }
    defaultDir: '',
    defaultBookmarks: [],
    bookmarks: (function () {
      try {
        var raw = localStorage.getItem(BM_KEY);
        var arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch (_) { return []; }
    })(),
    deleteUnlocked: false,
    deletePassword: '',
    viewMode: (function () { try { return localStorage.getItem(VIEW_KEY) || 'list'; } catch (_) { return 'list'; } })(),
    sortBy: (function () { try { return localStorage.getItem(SORT_KEY) || 'name'; } catch (_) { return 'name'; } })(),
    sortAsc: true,
    searchQuery: '',
    searchOpen: false,
    fabOpen: false,
    editingPath: '',
    previewItem: null,
    propsItem: null,
    dashboardUrl: (function () {
      try {
        var u = new URLSearchParams(window.location.search).get('dashboard');
        return u || '';
      } catch (_) { return ''; }
    })(),
  };

  var $ = function (id) { return document.getElementById(id); };
  var shell = $('fb-shell');
  var topbar = $('topbar');
  var btnMenu = $('btn-menu');
  var btnSelClose = $('btn-sel-close');
  var titleWrap = $('title-wrap');
  var folderTitle = $('folder-title');
  var folderSub = $('folder-sub');
  var searchWrap = $('search-wrap');
  var searchInput = $('search-input');
  var btnSearch = $('btn-search');
  var btnSearchClose = $('btn-search-close');
  var normalActions = $('normal-actions');
  var selActions = $('sel-actions');
  var btnMore = $('btn-more');
  var btnSelAll = $('btn-sel-all');
  var btnSelInvert = $('btn-sel-invert');
  var crumbBar = $('crumb-bar');
  var unlockStrip = $('unlock-strip');
  var btnRelock = $('btn-relock');
  var stage = $('stage');
  var itemsContainer = $('items-container');
  var emptyState = $('empty-state');
  var emptyText = $('empty-text');
  var fileInput = $('file-input');

  var menuBackdrop = $('menu-backdrop');
  var topMenu = $('top-menu');
  var selMenu = $('sel-menu');
  var bottomBar = $('bottom-bar');
  var pasteBar = $('paste-bar');
  var pasteInfo = $('paste-info');
  var fabBackdrop = $('fab-backdrop');
  var fabStack = $('fab-stack');
  var fabDial = $('fab-dial');
  var mainFab = $('main-fab');

  var drawerScrim = $('drawer-scrim');
  var drawer = $('drawer');
  var loginOverlay = $('login-overlay');
  var loginForm = $('login-form');
  var loginPass = $('login-pass');
  var loginErr = $('login-err');
  var toastEl = $('toast');
  var toastTimer = null;

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.add('hidden'); }, 2400);
  }

  function authHeaders(extra) {
    var h = extra ? Object.assign({}, extra) : {};
    if (state.password) h['Authorization'] = 'Bearer ' + state.password;
    if (state.deleteUnlocked) {
      h['X-Delete-Unlocked'] = 'true';
      h['X-Delete-Password'] = state.deletePassword;
    }
    return h;
  }

  function apiFetch(url, opts) {
    opts = opts || {};
    opts.headers = authHeaders(opts.headers);
    return fetch(url, opts).then(function (res) {
      if (res.status === 401) {
        showLogin('Session expired or invalid password');
        throw new Error('Unauthorized');
      }
      return res;
    });
  }

  function formatSize(bytes) {
    if (!bytes || bytes <= 0) return '0 B';
    var units = ['B', 'KB', 'MB', 'GB', 'TB'];
    var i = Math.floor(Math.log(bytes) / Math.log(1024));
    i = Math.min(i, units.length - 1);
    var val = bytes / Math.pow(1024, i);
    return (i === 0 ? val : val.toFixed(val >= 10 ? 1 : 2).replace(/\.0+$/, '')) + ' ' + units[i];
  }

  function formatDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var day = String(d.getDate()).padStart(2, '0');
    var mon = months[d.getMonth()];
    var yr = d.getFullYear();
    var hr = d.getHours();
    var ap = hr >= 12 ? 'pm' : 'am';
    hr = hr % 12 || 12;
    var min = String(d.getMinutes()).padStart(2, '0');
    return day + ' ' + mon + ' ' + yr + ', ' + hr + ':' + min + ' ' + ap;
  }

  function iconSvg(item) {
    if (item.isDrive) {
      return '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>';
    }
    if (item.isDirectory) {
      return '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
    }
    var ext = (item.ext || '').toLowerCase();
    if (VID_EXTS[ext]) {
      return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
    }
    if (AUD_EXTS[ext]) {
      return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
    }
    if (TXT_EXTS[ext]) {
      return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>';
    }
    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
  }

  function badgeClass(item) {
    if (item.isDirectory) return 'item-badge';
    var ext = (item.ext || '').toLowerCase();
    if (IMG_EXTS[ext]) return 'item-badge thumb';
    if (VID_EXTS[ext]) return 'item-badge file-video';
    if (AUD_EXTS[ext]) return 'item-badge file-audio';
    if (TXT_EXTS[ext]) return 'item-badge file-code';
    return 'item-badge file-other';
  }

  function previewUrl(p) {
    var q = '/api/fs/preview?path=' + encodeURIComponent(p);
    if (state.password) q += '&password=' + encodeURIComponent(state.password);
    return q;
  }

  function downloadUrl(p) {
    var q = '/api/fs/download?path=' + encodeURIComponent(p);
    if (state.password) q += '&password=' + encodeURIComponent(state.password);
    return q;
  }

  function selectedItems() {
    return state.entries.filter(function (e) { return Boolean(state.selected[e.path]); });
  }

  function filteredSortedEntries() {
    var q = state.searchQuery.trim().toLowerCase();
    var list = state.entries.filter(function (e) {
      return !q || e.name.toLowerCase().indexOf(q) !== -1;
    });
    var dir = state.sortAsc ? 1 : -1;
    list.sort(function (a, b) {
      if (a.isDirectory && !b.isDirectory) return -1;
      if (!a.isDirectory && b.isDirectory) return 1;
      if (state.sortBy === 'size') {
        return ((a.size || 0) - (b.size || 0)) * dir;
      }
      if (state.sortBy === 'date') {
        var ta = a.mtime ? new Date(a.mtime).getTime() : 0;
        var tb = b.mtime ? new Date(b.mtime).getTime() : 0;
        return (ta - tb) * dir;
      }
      return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }) * dir;
    });
    return list;
  }

  function hasSavedBookmarks() {
    try { return localStorage.getItem(BM_KEY) !== null; } catch (_) { return false; }
  }

  function saveBookmarks() {
    try { localStorage.setItem(BM_KEY, JSON.stringify(state.bookmarks)); } catch (_) {}
  }

  function cloneDefaultBookmarks() {
    return state.defaultBookmarks.map(function (b) {
      return { name: b.name || folderNameForPath(b.path), path: b.path };
    });
  }

  function applyServerDefaults(data) {
    if (!data || typeof data !== 'object') return;
    if (typeof data.defaultDir === 'string') {
      state.defaultDir = data.defaultDir.trim();
    }
    if (Array.isArray(data.defaultBookmarks)) {
      state.defaultBookmarks = data.defaultBookmarks
        .filter(function (b) { return b && typeof b.path === 'string' && b.path.trim() !== ''; })
        .map(function (b) {
          var p = b.path.trim();
          return { name: (typeof b.name === 'string' && b.name.trim()) ? b.name.trim() : folderNameForPath(p), path: p };
        });
      if (!hasSavedBookmarks()) {
        state.bookmarks = cloneDefaultBookmarks();
        renderBookmarks();
      }
    }
  }

  function resetBookmarksToDefault() {
    try { localStorage.removeItem(BM_KEY); } catch (_) {}
    state.bookmarks = cloneDefaultBookmarks();
    renderBookmarks();
    renderHeader();
    showToast('Bookmarks reset to default');
  }

  function isBookmarked(dirPath) {
    if (!dirPath || dirPath === '__DRIVES__') return false;
    return state.bookmarks.some(function (b) { return b.path === dirPath; });
  }

  function folderNameForPath(dirPath) {
    if (!dirPath) return '';
    if (dirPath === '/') return '/';
    var trimmed = dirPath.replace(/[\\/]+$/, '');
    if (/^[A-Za-z]:$/.test(trimmed)) return trimmed + '\\';
    var parts = trimmed.split(/[\\/]/);
    return parts[parts.length - 1] || dirPath;
  }

  function toggleBookmark(dirPath, customName) {
    if (!dirPath || dirPath === '__DRIVES__') return;
    var idx = -1;
    for (var i = 0; i < state.bookmarks.length; i++) {
      if (state.bookmarks[i].path === dirPath) { idx = i; break; }
    }
    if (idx !== -1) {
      state.bookmarks.splice(idx, 1);
      showToast('Bookmark removed');
    } else {
      state.bookmarks.push({ name: customName || folderNameForPath(dirPath), path: dirPath });
      showToast('Added to bookmarks');
    }
    saveBookmarks();
    renderBookmarks();
    renderHeader();
  }

  function renderBookmarks() {
    var box = $('drawer-bookmarks');
    if (!box) return;
    box.innerHTML = '';
    if (!state.bookmarks.length) {
      var empty = document.createElement('div');
      empty.className = 'drawer-empty';
      empty.textContent = 'No bookmarks yet';
      box.appendChild(empty);
      return;
    }
    state.bookmarks.forEach(function (bm) {
      var wrap = document.createElement('div');
      wrap.className = 'drawer-bm-wrap';
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'drawer-item' + (state.currentDir === bm.path ? ' active' : '');
      btn.innerHTML =
        '<span class="drawer-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></span>' +
        '<span class="drawer-item-text"><div class="drawer-item-title"></div><div class="drawer-item-sub"></div></span>';
      btn.querySelector('.drawer-item-title').textContent = bm.name || folderNameForPath(bm.path);
      btn.querySelector('.drawer-item-sub').textContent = bm.path;
      btn.addEventListener('click', function () { browse(bm.path); });

      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'drawer-bm-del';
      delBtn.title = 'Remove bookmark';
      delBtn.setAttribute('aria-label', 'Remove bookmark');
      delBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      delBtn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        toggleBookmark(bm.path);
      });

      wrap.appendChild(btn);
      wrap.appendChild(delBtn);
      box.appendChild(wrap);
    });
  }

  function folderDisplayName() {
    if (state.currentDir === '__DRIVES__') return 'System Drives';
    if (!state.currentDir) return 'Files';
    if (state.currentDir === '/') return '/';
    return folderNameForPath(state.currentDir);
  }

  function renderHeader() {
    var sel = selectedItems();
    var isSel = sel.length > 0;
    shell.classList.toggle('is-selecting', isSel);
    topbar.classList.toggle('sel-mode', isSel);
    btnMenu.classList.toggle('hidden', isSel);
    btnSelClose.classList.toggle('hidden', !isSel);
    normalActions.classList.toggle('hidden', isSel || state.searchOpen);
    selActions.classList.toggle('hidden', !isSel);
    bottomBar.classList.toggle('hidden', !isSel);
    fabStack.classList.toggle('hidden', isSel);

    if (isSel) {
      titleWrap.classList.remove('hidden');
      searchWrap.classList.add('hidden');
      folderTitle.textContent = sel.length === 1 ? '1 item selected' : sel.length + ' items selected';
      folderSub.textContent = sel.length === 1 ? sel[0].name : 'Tap actions below';
      $('ba-backup').disabled = state.currentDir === '__DRIVES__';
      $('ba-rename').disabled = sel.length !== 1;
      $('sm-open').disabled = sel.length !== 1;
      $('sm-download').disabled = sel.length !== 1 || sel[0].isDirectory;
      $('sm-copypath').disabled = sel.length !== 1;
      var canBmSel = sel.length === 1 && (sel[0].isDirectory || sel[0].isDrive);
      $('sm-bookmark').disabled = !canBmSel;
      $('sm-bookmark-label').textContent = (canBmSel && isBookmarked(sel[0].path)) ? 'Remove bookmark' : 'Add to bookmarks';
      $('sm-props').disabled = sel.length !== 1;
    } else {
      titleWrap.classList.toggle('hidden', state.searchOpen);
      searchWrap.classList.toggle('hidden', !state.searchOpen);
      folderTitle.textContent = folderDisplayName();
      var folders = 0, files = 0;
      for (var i = 0; i < state.entries.length; i++) {
        if (state.entries[i].isDirectory) folders++; else files++;
      }
      folderSub.textContent = folders + (folders === 1 ? ' folder, ' : ' folders, ') + files + (files === 1 ? ' file' : ' files');
    }

    // Paste bar (shown only when clipboard active and not selecting)
    var showPaste = Boolean(state.clipboard && state.clipboard.items.length && !isSel && state.currentDir !== '__DRIVES__');
    pasteBar.classList.toggle('hidden', !showPaste);
    if (showPaste) {
      var n = state.clipboard.items.length;
      pasteInfo.textContent = (state.clipboard.mode === 'cut' ? 'Move ' : 'Copy ') + n + (n === 1 ? ' item' : ' items');
    }

    // Delete lock UI
    unlockStrip.classList.toggle('hidden', !state.deleteUnlocked);
    $('m-lock-label').textContent = state.deleteUnlocked ? 'Lock Delete' : 'Unlock Delete';
    $('nav-lock-title').textContent = state.deleteUnlocked ? 'Delete Unlocked' : 'Delete Locked';
    $('nav-lock-sub').textContent = state.deleteUnlocked ? 'Tap to re-enable safety lock' : 'Tap to unlock file deletion';
    $('nav-lock-ico').style.background = state.deleteUnlocked ? '#dc2626' : '#b45309';

    // Sort / view / menu labels
    $('m-view-label').textContent = state.viewMode === 'grid' ? 'List view' : 'Grid view';
    var sortNames = { name: 'Name', size: 'Size', date: 'Date' };
    $('m-sort-label').textContent = (sortNames[state.sortBy] || 'Name') + (state.sortAsc ? ' ↑' : ' ↓');
    var canBmCur = Boolean(state.currentDir && state.currentDir !== '__DRIVES__');
    $('m-bookmark').disabled = !canBmCur;
    $('m-bookmark-label').textContent = (canBmCur && isBookmarked(state.currentDir)) ? 'Remove bookmark' : 'Add to bookmarks';
    $('m-paste').classList.toggle('hidden', !state.clipboard || state.currentDir === '__DRIVES__');
    if (state.clipboard) {
      $('m-paste-label').textContent = (state.clipboard.mode === 'cut' ? 'Move ' : 'Paste ') + state.clipboard.items.length + ' item(s)';
    }
    $('m-obs').classList.toggle('hidden', !state.dashboardUrl);
    $('nav-obs').classList.toggle('hidden', !state.dashboardUrl);
    $('m-logout').classList.toggle('hidden', !state.authRequired);
    $('nav-logout').classList.toggle('hidden', !state.authRequired);
  }

  function renderBreadcrumbs() {
    crumbBar.innerHTML = '';
    if (state.currentDir === '__DRIVES__') {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'crumb-btn active';
      b.textContent = 'SYSTEM DRIVES';
      crumbBar.appendChild(b);
      return;
    }

    var dir = state.currentDir || '';
    var segs = [];

    if (/^[A-Za-z]:/.test(dir)) {
      var partsW = dir.replace(/[\\/]+$/, '').split('\\');
      var accW = '';
      segs.push({ label: 'DRIVES', path: '__DRIVES__' });
      partsW.forEach(function (part, idx) {
        accW = idx === 0 ? part + '\\' : accW.replace(/\\+$/, '') + '\\' + part;
        segs.push({ label: part, path: accW });
      });
    } else {
      segs.push({ label: 'ROOT', path: '/' });
      var partsL = dir.split('/').filter(Boolean);
      var accL = '';
      partsL.forEach(function (part) {
        accL += '/' + part;
        segs.push({ label: part, path: accL });
      });
    }

    segs.forEach(function (seg, idx) {
      if (idx > 0) {
        var sp = document.createElement('span');
        sp.className = 'crumb-sep';
        sp.textContent = '›';
        crumbBar.appendChild(sp);
      }
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'crumb-btn' + (idx === segs.length - 1 ? ' active' : '');
      btn.textContent = seg.label;
      btn.addEventListener('click', function () {
        if (idx < segs.length - 1) browse(seg.path);
      });
      crumbBar.appendChild(btn);
    });
    crumbBar.scrollLeft = crumbBar.scrollWidth;
  }

  function renderEntries() {
    var list = filteredSortedEntries();
    itemsContainer.innerHTML = '';
    itemsContainer.className = state.viewMode === 'grid' ? 'file-grid' : 'file-list';

    if (!list.length) {
      emptyState.classList.remove('hidden');
      emptyText.textContent = state.searchQuery ? 'No matching items' : 'This folder is empty';
      return;
    }
    emptyState.classList.add('hidden');

    var cutMap = {};
    if (state.clipboard && state.clipboard.mode === 'cut') {
      state.clipboard.items.forEach(function (it) { cutMap[it.path] = true; });
    }

    var frag = document.createDocumentFragment();

    list.forEach(function (item) {
      var isSelected = Boolean(state.selected[item.path]);
      var isCut = Boolean(cutMap[item.path]);
      var ext = (item.ext || '').toLowerCase();
      var isImg = !item.isDirectory && Boolean(IMG_EXTS[ext]);

      var subLeft = item.isDrive
        ? 'Drive'
        : item.isDirectory
          ? (item.itemCount === 0 ? 'Empty' : item.itemCount != null ? (item.itemCount + (item.itemCount === 1 ? ' item' : ' items')) : 'Folder')
          : formatSize(item.size);
      var dateText = formatDate(item.mtime);

      var card = document.createElement('div');
      if (state.viewMode === 'grid') {
        card.className = 'grid-card' + (isSelected ? ' selected' : '') + (isCut ? ' cut-dim' : '');
        card.innerHTML =
          '<span class="grid-check">' + (isSelected ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><polyline points="20 6 9 17 4 12"/></svg>' : '') + '</span>' +
          '<div class="' + badgeClass(item) + '">' + (isImg ? '<img loading="lazy" alt="" src="' + previewUrl(item.path) + '" />' : iconSvg(item)) + '</div>' +
          '<div class="grid-name"></div>' +
          '<div class="grid-sub"></div>';
        card.querySelector('.grid-name').textContent = item.name;
        card.querySelector('.grid-sub').textContent = subLeft;
      } else {
        card.className = 'file-row' + (isSelected ? ' selected' : '') + (isCut ? ' cut-dim' : '');
        card.innerHTML =
          '<span class="row-check">' + (isSelected ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><polyline points="20 6 9 17 4 12"/></svg>' : '') + '</span>' +
          '<div class="' + badgeClass(item) + '">' + (isImg ? '<img loading="lazy" alt="" src="' + previewUrl(item.path) + '" />' : iconSvg(item)) + '</div>' +
          '<div class="row-main">' +
            '<div class="row-name"></div>' +
            '<div class="row-meta"><span class="row-sub"></span><span class="row-date"></span></div>' +
          '</div>';
        card.querySelector('.row-name').textContent = item.name;
        card.querySelector('.row-sub').textContent = subLeft;
        card.querySelector('.row-date').textContent = dateText;
      }

      // Tap badge/checkbox to toggle selection directly without opening
      var badgeEl = card.querySelector('.item-badge');
      var checkEl = card.querySelector('.row-check, .grid-check');
      var toggleFn = function (ev) {
        ev.stopPropagation();
        toggleSelect(item);
      };
      if (badgeEl) badgeEl.addEventListener('click', toggleFn);
      if (checkEl) checkEl.addEventListener('click', toggleFn);

      // Long press (touch / pointer) enters selection mode
      var pressTimer = null;
      var longPressed = false;
      card.addEventListener('pointerdown', function (ev) {
        if (ev.button !== 0) return;
        longPressed = false;
        pressTimer = setTimeout(function () {
          longPressed = true;
          if (!state.selected[item.path]) toggleSelect(item);
        }, 420);
      });
      var cancelPress = function () { clearTimeout(pressTimer); };
      card.addEventListener('pointerup', cancelPress);
      card.addEventListener('pointercancel', cancelPress);
      card.addEventListener('pointermove', cancelPress);

      // Right-click on desktop toggles selection
      card.addEventListener('contextmenu', function (ev) {
        ev.preventDefault();
        toggleSelect(item);
      });

      card.addEventListener('click', function () {
        if (longPressed) { longPressed = false; return; }
        var hasSel = selectedItems().length > 0;
        if (hasSel) {
          toggleSelect(item);
        } else {
          openItem(item);
        }
      });

      frag.appendChild(card);
    });

    itemsContainer.appendChild(frag);
  }

  function renderAll() {
    renderHeader();
    renderBreadcrumbs();
    renderEntries();
  }

  function toggleSelect(item) {
    if (state.selected[item.path]) delete state.selected[item.path];
    else state.selected[item.path] = true;
    renderAll();
  }

  function clearSelection() {
    state.selected = {};
    renderAll();
  }

  function closeMenus() {
    menuBackdrop.classList.add('hidden');
    topMenu.classList.add('hidden');
    selMenu.classList.add('hidden');
  }

  function setFabOpen(open) {
    state.fabOpen = open;
    fabBackdrop.classList.toggle('hidden', !open);
    fabDial.classList.toggle('hidden', !open);
    mainFab.classList.toggle('open', open);
  }

  function setDrawerOpen(open) {
    drawerScrim.classList.toggle('hidden', !open);
    drawer.classList.toggle('hidden', !open);
  }

  function getDirFromUrl() {
    try {
      var d = new URLSearchParams(window.location.search).get('dir');
      return d && d.trim() ? d.trim() : '';
    } catch (_) { return ''; }
  }

  function syncUrlDir(dirPath, mode) {
    if (!dirPath || mode === 'none') return;
    try {
      if (!window.history || !window.history.replaceState) return;
      var url = new URL(window.location.href);
      var currentParam = url.searchParams.get('dir') || '';
      url.searchParams.set('dir', dirPath);
      var nextUrl = url.pathname + url.search + url.hash;
      if (mode === 'push' && currentParam !== dirPath && window.history.pushState) {
        window.history.pushState({ fbDir: dirPath }, '', nextUrl);
      } else {
        window.history.replaceState({ fbDir: dirPath }, '', nextUrl);
      }
    } catch (_) {}
  }

  function browse(dir, opts) {
    var target = dir || state.currentDir || '__DRIVES__';
    var historyMode = (opts && opts.historyMode) || (dir ? 'push' : 'replace');
    state.selected = {};
    closeMenus();
    setDrawerOpen(false);
    return apiFetch('/api/fs/browse?dir=' + encodeURIComponent(target))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error);
        state.currentDir = data.currentDir;
        state.parentDir = data.parentDir;
        if (data.platform) {
          state.platform = data.platform;
          $('nav-drives-title').textContent = data.platform === 'win32' ? 'System Drives' : 'Root /';
        }
        state.entries = Array.isArray(data.entries) ? data.entries : [];
        syncUrlDir(state.currentDir, historyMode);
        renderBookmarks();
        renderAll();
      })
      .catch(function (err) {
        if (err.message !== 'Unauthorized') showToast(err.message || 'Failed to load folder');
      });
  }

  function openItem(item) {
    if (item.isDirectory || item.isDrive) {
      browse(item.path);
      return;
    }
    var ext = (item.ext || '').toLowerCase();
    if (IMG_EXTS[ext] || VID_EXTS[ext] || AUD_EXTS[ext]) {
      openPreview(item);
    } else if (TXT_EXTS[ext] || item.size <= 512 * 1024) {
      openEditor(item);
    } else {
      window.open(downloadUrl(item.path), '_blank');
    }
  }

  // Dialog helpers
  function openDialog(opts) {
    return new Promise(function (resolve) {
      var modal = $('dialog-modal');
      var titleEl = $('dialog-title');
      var msgEl = $('dialog-msg');
      var inp = $('dialog-input');
      var okBtn = $('dialog-ok');
      var cancelBtn = $('dialog-cancel');

      titleEl.textContent = opts.title || 'Confirm';
      if (opts.message) {
        msgEl.textContent = opts.message;
        msgEl.classList.remove('hidden');
      } else {
        msgEl.classList.add('hidden');
      }
      if (opts.prompt) {
        inp.type = opts.inputType || 'text';
        inp.value = opts.defaultValue || '';
        inp.placeholder = opts.placeholder || '';
        inp.classList.remove('hidden');
      } else {
        inp.type = 'text';
        inp.value = '';
        inp.classList.add('hidden');
      }
      okBtn.textContent = opts.okText || 'OK';
      okBtn.className = 'btn ' + (opts.danger ? 'danger' : 'primary');
      modal.classList.remove('hidden');

      if (opts.prompt) {
        setTimeout(function () { inp.focus(); inp.select(); }, 30);
      }

      function cleanup(val) {
        modal.classList.add('hidden');
        inp.type = 'text';
        inp.value = '';
        okBtn.removeEventListener('click', onOk);
        cancelBtn.removeEventListener('click', onCancel);
        inp.removeEventListener('keydown', onKey);
        resolve(val);
      }
      function onOk() { cleanup(opts.prompt ? inp.value : true); }
      function onCancel() { cleanup(opts.prompt ? null : false); }
      function onKey(e) {
        if (e.key === 'Enter') { e.preventDefault(); onOk(); }
        if (e.key === 'Escape') { e.preventDefault(); onCancel(); }
      }
      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
      inp.addEventListener('keydown', onKey);
    });
  }

  function openEditor(item) {
    apiFetch('/api/fs/content?path=' + encodeURIComponent(item.path))
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.data.error || 'Cannot open file');
        state.editingPath = item.path;
        $('editor-title').textContent = item.name;
        $('editor-area').value = res.data.content || '';
        $('editor-modal').classList.remove('hidden');
      })
      .catch(function (err) {
        showToast(err.message || 'Cannot edit file');
      });
  }

  function openPreview(item) {
    state.previewItem = item;
    $('preview-title').textContent = item.name;
    var body = $('preview-body');
    body.innerHTML = '';
    var src = previewUrl(item.path);
    var ext = (item.ext || '').toLowerCase();
    var el;
    if (IMG_EXTS[ext]) {
      el = document.createElement('img');
      el.src = src;
    } else if (VID_EXTS[ext]) {
      el = document.createElement('video');
      el.src = src;
      el.controls = true;
      el.autoplay = true;
    } else {
      el = document.createElement('audio');
      el.src = src;
      el.controls = true;
      el.autoplay = true;
    }
    body.appendChild(el);
    $('preview-modal').classList.remove('hidden');
  }

  function openProps(item) {
    state.propsItem = item;
    var grid = $('props-grid');
    grid.innerHTML = '';
    var rows = [
      ['Name', item.name],
      ['Type', item.isDrive ? 'Drive' : item.isDirectory ? 'Folder' : (item.ext || 'File')],
      ['Size', item.isDirectory ? (item.itemCount != null ? item.itemCount + ' items' : 'Folder') : formatSize(item.size) + ' (' + item.size + ' B)'],
      ['Modified', formatDate(item.mtime) || '—'],
      ['OBS Path', item.path],
    ];
    rows.forEach(function (pair) {
      var k = document.createElement('div');
      k.className = 'prop-k';
      k.textContent = pair[0];
      var v = document.createElement('div');
      v.className = 'prop-v';
      v.textContent = pair[1];
      grid.appendChild(k);
      grid.appendChild(v);
    });
    $('props-modal').classList.remove('hidden');
  }

  function copyToClipboard(text) {
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast('Copied to clipboard');
      }).catch(function () { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('Copied to clipboard'); } catch (_) {}
    document.body.removeChild(ta);
  }

  // Operations
  function doMkdir() {
    setFabOpen(false);
    if (state.currentDir === '__DRIVES__') return showToast('Open a drive first');
    openDialog({ title: 'New folder', prompt: true, placeholder: 'Folder name', okText: 'Create' })
      .then(function (name) {
        if (!name || !name.trim()) return;
        return apiFetch('/api/fs/mkdir', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dir: state.currentDir, name: name.trim() }),
        }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error); return d; }); })
          .then(function () { showToast('Folder created'); browse(); })
          .catch(function (e) { showToast(e.message || 'Create failed'); });
      });
  }

  function doMkfile() {
    setFabOpen(false);
    if (state.currentDir === '__DRIVES__') return showToast('Open a drive first');
    openDialog({ title: 'New file', prompt: true, placeholder: 'notes.txt', okText: 'Create' })
      .then(function (name) {
        if (!name || !name.trim()) return;
        return apiFetch('/api/fs/mkfile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dir: state.currentDir, name: name.trim(), content: '' }),
        }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error); return d; }); })
          .then(function () { showToast('File created'); browse(); })
          .catch(function (e) { showToast(e.message || 'Create failed'); });
      });
  }

  function doRename() {
    var sel = selectedItems();
    if (sel.length !== 1) return;
    var target = sel[0];
    openDialog({ title: 'Rename', prompt: true, defaultValue: target.name, okText: 'Rename' })
      .then(function (newName) {
        if (!newName || !newName.trim() || newName.trim() === target.name) return;
        return apiFetch('/api/fs/rename', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: target.path, newName: newName.trim() }),
        }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error); return d; }); })
          .then(function () { showToast('Renamed'); browse(); })
          .catch(function (e) { showToast(e.message || 'Rename failed'); });
      });
  }

  function toggleDeleteLock() {
    closeMenus();
    if (state.deleteUnlocked) {
      state.deleteUnlocked = false;
      state.deletePassword = '';
      renderHeader();
      showToast('Delete lock enabled');
      return;
    }
    openDialog({
      title: 'Unlock Delete Mode',
      message: 'Enter the delete password to allow deleting files and empty folders.',
      prompt: true,
      inputType: 'password',
      placeholder: 'Delete password',
      okText: 'Unlock',
      danger: true,
    }).then(function (entered) {
      if (entered === null) return;
      return apiFetch('/api/auth/verify-delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: entered }),
      })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
        .then(function (res) {
          if (!res.ok) {
            showToast(res.data.error || 'Invalid delete password');
            return;
          }
          state.deleteUnlocked = true;
          state.deletePassword = entered;
          renderHeader();
          showToast('Delete unlocked');
        })
        .catch(function (err) {
          if (err.message !== 'Unauthorized') showToast(err.message || 'Failed to verify delete password');
        });
    });
  }

  function doDelete() {
    var sel = selectedItems();
    if (!sel.length) return;
    if (!state.deleteUnlocked) {
      if (state.currentDir === '__DRIVES__') {
        showToast('Delete lock is enabled. Unlock Delete from the sidebar or menu first.');
        return;
      }
      openDialog({
        title: 'Delete Locked',
        message: 'Delete lock is enabled for safety. Unlock Delete from the sidebar or menu to permanently delete, or move ' + sel.length + (sel.length === 1 ? ' item' : ' items') + ' to the BackUp folder instead.',
        okText: 'Move to BackUp',
        danger: false,
      }).then(function (ok) {
        if (ok) executeBackup(sel);
      });
      return;
    }
    openDialog({
      title: 'Delete ' + sel.length + (sel.length === 1 ? ' item?' : ' items?'),
      message: sel.length === 1 ? sel[0].name : 'Selected files and empty folders will be permanently removed.',
      okText: 'Delete',
      danger: true,
    }).then(function (ok) {
      if (ok) executeDelete(sel);
    });
  }

  function executeDelete(items) {
    apiFetch('/api/fs/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paths: items.map(function (i) { return i.path; }) }),
    }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error); return d; }); })
      .then(function (d) {
        showToast('Deleted ' + (d.deleted ? d.deleted.length : items.length) + ' item(s)');
        browse();
      })
      .catch(function (e) { showToast(e.message || 'Delete failed'); });
  }

  function doBackup() {
    var sel = selectedItems();
    if (!sel.length || state.currentDir === '__DRIVES__') return;
    executeBackup(sel);
  }

  function executeBackup(items) {
    apiFetch('/api/fs/backup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sources: items.map(function (i) { return i.path; }),
        dir: state.currentDir,
      }),
    }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error); return d; }); })
      .then(function (d) {
        var count = d.moved ? d.moved.length : items.length;
        var msg = 'Moved ' + count + (count === 1 ? ' item' : ' items') + ' to BackUp';
        if (d.skipped) msg += ' (skipped BackUp folder)';
        showToast(msg);
        browse();
      })
      .catch(function (e) { showToast(e.message || 'Move to BackUp failed'); });
  }

  function doPaste() {
    closeMenus();
    if (!state.clipboard || !state.clipboard.items.length) return;
    if (state.currentDir === '__DRIVES__') return showToast('Open a folder first');
    var ep = state.clipboard.mode === 'cut' ? '/api/fs/move' : '/api/fs/copy';
    var sources = state.clipboard.items.map(function (i) { return i.path; });
    apiFetch(ep, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sources: sources, destDir: state.currentDir }),
    }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error); return d; }); })
      .then(function () {
        var wasCut = state.clipboard.mode === 'cut';
        if (wasCut) state.clipboard = null;
        showToast(wasCut ? 'Moved items' : 'Copied items');
        browse();
      })
      .catch(function (e) { showToast(e.message || 'Paste failed'); });
  }

  function uploadFiles(files) {
    if (!files || !files.length) return;
    if (state.currentDir === '__DRIVES__') return showToast('Open a folder before uploading');
    var list = Array.prototype.slice.call(files);
    var toast = $('upload-toast');
    var nameEl = $('upload-name');
    var pctEl = $('upload-pct');
    var fillEl = $('upload-fill');
    var idx = 0;

    function next() {
      if (idx >= list.length) {
        toast.classList.add('hidden');
        showToast('Uploaded ' + list.length + (list.length === 1 ? ' file' : ' files'));
        browse();
        return;
      }
      var f = list[idx++];
      toast.classList.remove('hidden');
      nameEl.textContent = '(' + idx + '/' + list.length + ') ' + f.name;
      pctEl.textContent = '0%';
      fillEl.style.width = '0%';

      var xhr = new XMLHttpRequest();
      var url = '/api/upload?dir=' + encodeURIComponent(state.currentDir);
      xhr.open('POST', url, true);
      if (state.password) xhr.setRequestHeader('Authorization', 'Bearer ' + state.password);
      xhr.upload.onprogress = function (e) {
        if (e.lengthComputable) {
          var p = Math.round((e.loaded / e.total) * 100);
          pctEl.textContent = p + '%';
          fillEl.style.width = p + '%';
        }
      };
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          next();
        } else {
          toast.classList.add('hidden');
          showToast('Upload failed: ' + f.name);
        }
      };
      xhr.onerror = function () {
        toast.classList.add('hidden');
        showToast('Network error uploading ' + f.name);
      };
      var fd = new FormData();
      fd.append('media', f);
      xhr.send(fd);
    }
    next();
  }

  // Login screen controls
  function showLogin(errMsg) {
    loginOverlay.classList.remove('hidden');
    if (errMsg) {
      loginErr.textContent = errMsg;
      loginErr.classList.remove('hidden');
    } else {
      loginErr.classList.add('hidden');
    }
    setTimeout(function () { loginPass.focus(); }, 40);
  }

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = loginPass.value;
    loginErr.classList.add('hidden');
    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) {
          loginErr.textContent = res.d.error || 'Invalid password';
          loginErr.classList.remove('hidden');
          return;
        }
        state.password = pw;
        try { localStorage.setItem(PW_KEY, pw); } catch (_) {}
        applyServerDefaults(res.d);
        loginPass.value = '';
        loginOverlay.classList.add('hidden');
        browse(getDirFromUrl() || state.defaultDir || '__DRIVES__', { historyMode: 'replace' });
      })
      .catch(function () {
        loginErr.textContent = 'Connection failed';
        loginErr.classList.remove('hidden');
      });
  });

  $('sm-download').addEventListener('click', function () {

      window.open(downloadUrl(sel[0].path), '_blank');
    }

  $('sm-copypath').addEventListener('click', function () {
    closeMenus();
    var sel = selectedItems();
    if (sel.length === 1) copyToClipboard(sel[0].path);
  });
  $('sm-bookmark').addEventListener('click', function () {
    closeMenus();
    var sel = selectedItems();
    if (sel.length === 1 && (sel[0].isDirectory || sel[0].isDrive)) {
      toggleBookmark(sel[0].path, sel[0].name);
      clearSelection();
    }
  });
  $('sm-props').addEventListener('click', function () {
    closeMenus();
    var sel = selectedItems();
    if (sel.length === 1) openProps(sel[0]);
  });

  // Paste bar & unlock strip
  $('btn-paste-go').addEventListener('click', doPaste);
  $('btn-paste-cancel').addEventListener('click', function () {
    state.clipboard = null;
    renderAll();
  });
  btnRelock.addEventListener('click', function () {
    state.deleteUnlocked = false;
    state.deletePassword = '';
    renderHeader();
    showToast('Delete lock enabled');
  });

  // FAB Speed Dial
  mainFab.addEventListener('click', function (e) {
    e.stopPropagation();
    setFabOpen(!state.fabOpen);
  });
  fabBackdrop.addEventListener('click', function () { setFabOpen(false); });
  $('fab-mkdir').addEventListener('click', doMkdir);
  $('fab-mkfile').addEventListener('click', doMkfile);
  $('fab-upload').addEventListener('click', function () {
    setFabOpen(false);
    fileInput.value = '';
    fileInput.click();
  });
  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files.length) uploadFiles(fileInput.files);
  });

  // Drawer Nav
  $('nav-project').addEventListener('click', function () { browse('__PROJECT__'); });
  $('nav-drives').addEventListener('click', function () { browse('__DRIVES__'); });
  $('btn-reset-bookmarks').addEventListener('click', function () { resetBookmarksToDefault(); });
  $('nav-lock').addEventListener('click', function () { setDrawerOpen(false); toggleDeleteLock(); });
  $('nav-obs').addEventListener('click', function () { if (state.dashboardUrl) window.location.href = state.dashboardUrl; });
  $('nav-logout').addEventListener('click', doLogout);

  // Modals close / save
  $('editor-close').addEventListener('click', function () { $('editor-modal').classList.add('hidden'); });
  $('editor-cancel').addEventListener('click', function () { $('editor-modal').classList.add('hidden'); });
  $('editor-save').addEventListener('click', function () {
    if (!state.editingPath) return;
    apiFetch('/api/fs/content', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: state.editingPath, content: $('editor-area').value }),
    }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error); return d; }); })
      .then(function () {
        $('editor-modal').classList.add('hidden');
        showToast('Saved');
        browse();
      })
      .catch(function (e) { showToast(e.message || 'Save failed'); });
  });

  $('preview-close').addEventListener('click', function () {
    $('preview-modal').classList.add('hidden');
    $('preview-body').innerHTML = '';
  });
  $('preview-copy-path').addEventListener('click', function () {
    if (state.previewItem) copyToClipboard(state.previewItem.path);
  });
  $('preview-download').addEventListener('click', function () {
    if (state.previewItem) window.open(downloadUrl(state.previewItem.path), '_blank');
  });

  $('props-close').addEventListener('click', function () { $('props-modal').classList.add('hidden'); });
  $('props-ok').addEventListener('click', function () { $('props-modal').classList.add('hidden'); });
  $('props-copy').addEventListener('click', function () {
    if (state.propsItem) copyToClipboard(state.propsItem.path);
  });

  // Drag & Drop upload
  var dragDepth = 0;
  shell.addEventListener('dragenter', function (e) {
    e.preventDefault();
    dragDepth++;
    $('drop-overlay').classList.remove('hidden');
  });
  shell.addEventListener('dragover', function (e) { e.preventDefault(); });
  shell.addEventListener('dragleave', function (e) {
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) $('drop-overlay').classList.add('hidden');
  });
  shell.addEventListener('drop', function (e) {
    e.preventDefault();
    dragDepth = 0;
    $('drop-overlay').classList.add('hidden');
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
      uploadFiles(e.dataTransfer.files);
    }
  });

  // Keyboard Escape
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closeMenus();
      setFabOpen(false);
      setDrawerOpen(false);
      if (selectedItems().length) clearSelection();
    }
  });

  // Browser Back / Forward folder navigation
  window.addEventListener('popstate', function (e) {
    if (!loginOverlay.classList.contains('hidden')) return;
    var target = (e.state && e.state.fbDir) || getDirFromUrl() || state.defaultDir || '__DRIVES__';
    if (target && target !== state.currentDir) {
      browse(target, { historyMode: 'none' });
    }
  });

  // Startup initialization
  renderBookmarks();
  fetch('/api/status', { headers: authHeaders() })
    .then(function (r) { return r.json(); })
    .then(function (st) {
      state.authRequired = Boolean(st.authRequired);
      state.platform = st.platform || state.platform;
      if (st.authRequired && !st.authValid) {
        showLogin('');
      } else {
        applyServerDefaults(st);
        browse(getDirFromUrl() || state.defaultDir || '__DRIVES__', { historyMode: 'replace' });
      }
    })
    .catch(function () {
      browse(getDirFromUrl() || '__DRIVES__', { historyMode: 'replace' });
    });
})();
</script>
</body>
</html>
