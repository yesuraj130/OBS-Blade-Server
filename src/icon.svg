<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1322"/>
      <stop offset="100%" stop-color="#070f1a"/>
    </linearGradient>
    <linearGradient id="bladeLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="bladeDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>
  </defs>

  <!-- Rounded App Icon Surface -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- OBS Outer Ring (Silver + Coral Inner Accent) -->
  <circle cx="256" cy="256" r="176" fill="#070f1a" stroke="#e2e8f0" stroke-width="18"/>
  <circle cx="256" cy="256" r="161" fill="none" stroke="#ff4766" stroke-width="10"/>

  <!-- Three Interlocking OBS Swirl Crescents -->
  <g fill="#e2e8f0">
    <path d="M256 122 C188 126 156 184 196 242 C214 268 232 254 222 224 C202 184 218 148 256 122 Z"/>
    <path d="M256 122 C188 126 156 184 196 242 C214 268 232 254 222 224 C202 184 218 148 256 122 Z" transform="rotate(120 256 256)"/>
    <path d="M256 122 C188 126 156 184 196 242 C214 268 232 254 222 224 C202 184 218 148 256 122 Z" transform="rotate(240 256 256)"/>
  </g>

  <!-- Diagonal OBS Blade Slash (Dark Halo + Two-Tone Metallic Edge) -->
  <g>
    <polygon points="434,78 408,142 138,412 78,434 100,374 370,104" fill="#070f1a" stroke="#070f1a" stroke-width="20" stroke-linejoin="round"/>
    <polygon points="434,78 370,104 100,374 78,434 256,256" fill="url(#bladeLight)"/>
    <polygon points="434,78 408,142 138,412 78,434 256,256" fill="url(#bladeDark)"/>
  </g>

  <!-- Center Studio Lens Core -->
  <circle cx="256" cy="256" r="52" fill="#070f1a"/>
  <circle cx="256" cy="256" r="42" fill="#e2e8f0"/>
  <circle cx="256" cy="256" r="30" fill="#0b1322"/>
  <circle cx="256" cy="256" r="22" fill="url(#coreGlow)"/>
  <circle cx="249" cy="249" r="6" fill="#ffffff" opacity="0.85"/>
</svg>
